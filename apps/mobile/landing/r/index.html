<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>EatSafe</title>
    <script src="/config.js"></script>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 24px; }
      .card { max-width: 640px; margin: 0 auto; border: 1px solid rgba(0,0,0,0.1); border-radius: 12px; padding: 16px; }
      .row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
      a.btn { display: inline-block; padding: 10px 14px; border-radius: 10px; text-decoration: none; border: 1px solid rgba(0,0,0,0.12); }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>EatSafe</h1>
      <p>Ouverture du restaurant…</p>
      <div class="row">
        <a class="btn" id="openApp" href="#">Ouvrir l’app</a>
        <a class="btn" id="install" href="#">Installer</a>
      </div>
      <p id="hint" style="color:#666;margin-top:12px"></p>
    </div>

    <script>
      (function () {
        var cfg = (window.EATSAFE_LANDING_CONFIG || {});
        var scheme = cfg.APP_SCHEME || "eatsafe://";

        // Expected URL: /r/<publicId>
        var path = window.location.pathname || "";
        var parts = path.split("/").filter(Boolean);
        var publicId = parts.length >= 2 ? parts[1] : "";

        var ua = navigator.userAgent || "";
        var isAndroid = /Android/i.test(ua);
        var isIOS = /iPhone|iPad|iPod/i.test(ua);

        function storeUrl() {
          if (isAndroid && cfg.ANDROID_STORE_URL) return cfg.ANDROID_STORE_URL;
          if (isIOS && cfg.IOS_STORE_URL) return cfg.IOS_STORE_URL;
          return cfg.ANDROID_STORE_URL || cfg.IOS_STORE_URL || "";
        }

        var openApp = document.getElementById("openApp");
        var install = document.getElementById("install");
        var hint = document.getElementById("hint");

        var deepLink = scheme + "r/" + encodeURIComponent(publicId);
        openApp.href = deepLink;

        openApp.addEventListener("click", function (e) {
          e.preventDefault();
          window.location.href = deepLink;
        });

        var sUrl = storeUrl();
        if (sUrl) {
          install.href = sUrl;
        } else {
          install.href = "#";
        }

        // Auto-attempt open, then fallback to store.
        var startedAt = Date.now();
        window.location.href = deepLink;

        setTimeout(function () {
          if (document.hidden) return; // app likely opened
          if (!publicId) {
            hint.textContent = "Lien invalide.";
            return;
          }
          if (sUrl) {
            hint.textContent = "Si l’app ne s’ouvre pas, installe-la depuis le store.";
            window.location.href = sUrl;
          } else {
            hint.textContent = "Store URL non configurée (config.js).";
          }
        }, 900);
      })();
    </script>
  </body>
</html>
